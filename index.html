<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Básico -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Ícone -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1177E3" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- SEO -->
    <title>Meus Sentidos | Clínica Especializada em TEA</title>

    <meta
      name="description"
      content="A Clínica Meus Sentidos é especializada no atendimento de crianças e adolescentes com TEA. Conheça nossos serviços, equipe multidisciplinar e entre em contato pelo WhatsApp."
    />

    <meta
      name="keywords"
      content="clínica TEA, autismo, clínica infantil, terapia TEA, Meus Sentidos, atendimento multidisciplinar"
    />

    <meta name="author" content="Clínica Meus Sentidos" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.meussentidos.com.br/" />

    <!-- Open Graph (Instagram, WhatsApp, Facebook) -->
    <meta property="og:title" content="Meus Sentidos | Clínica Especializada em TEA" />
    <meta
      property="og:description"
      content="Atendimento especializado para crianças e adolescentes com TEA. Fale conosco e conheça nossos serviços."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://www.meussentidos.com.br/" />
    <meta property="og:image" content="https://www.meussentidos.com.br/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Logo da Clínica Meus Sentidos — Terapias Integradas"
    />
    <meta property="og:site_name" content="Meus Sentidos" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meus Sentidos | Clínica Especializada em TEA" />
    <meta
      name="twitter:description"
      content="Clínica especializada no atendimento de crianças e adolescentes com TEA."
    />
    <meta name="twitter:image" content="https://www.meussentidos.com.br/og-image.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
